<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LitToon - Login</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7ff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:white;padding:30px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.1);width:90%;max-width:400px}
h1{color:#3b5bff;text-align:center}
input,select,button{width:100%;padding:14px;margin:10px 0;border-radius:10px;border:1px solid #ddd;font-size:16px;box-sizing:border-box}
button{background:#3b5bff;color:white;border:none;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h1>LitToon</h1>
<p style="text-align:center;color:#666">Enter your name to continue</p>
<input type="text" id="name" placeholder="Your Name e.g. Samuel">
<select id="class"><option value="">Select Class</option><option>SS1</option><option>SS2</option><option>SS3</option></select>
<button onclick="login()">Continue to Library</button>
</div>
<script>
function login(){
 const name=document.getElementById('name').value.trim();
 const cls=document.getElementById('class').value;
 if(!name||!cls){alert('Please enter name and class');return;}
 localStorage.setItem('lt_name',name);
 localStorage.setItem('lt_class',cls);
 window.location.href='index.html';
}
</script>
</body>
</html>
