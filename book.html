<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LitToon - Chapters</title>
<style>
body{font-family:Arial,sans-serif;background:#f8f9ff;margin:0;line-height:1.6}
.header{background:#3b5bff;color:white;padding:15px;display:flex;align-items:center}
.header a{color:white;text-decoration:none;margin-right:15px}
.content{background:white;margin:15px;padding:20px;border-radius:12px}
.chapter-card{padding:14px;border:1px solid #e0e0e0;border-radius:10px;margin:10px 0;cursor:pointer}
.chapter-card:hover{border-color:#3b5bff;background:#f5f7ff}
.blue-btn{background:#0d6efd;color:white;border:none;padding:10px 14px;border-radius:8px;width:100%;text-align:left;font-weight:bold;cursor:pointer;margin-top:10px}
.long-content{display:none;background:#e8f0fe;padding:15px;border-radius:0 0 8px 8px;margin-top:-4px}
</style>
</head>
<body>
<div class="header"><a href="index.html">← Back</a><span id="bookTitle">LitToon</span></div>
<div class="content" id="content">Loading chapters...</div>

<script>
const params=new URLSearchParams(window.location.search);
const bookId=params.get('book');
const chapterParam=params.get('chapter');

fetch('data/books.json').then(r=>r.json()).then(all=>{
 const book=all.find(b=>b.id===bookId);
 document.getElementById('bookTitle').innerText=book.title;
 const container=document.getElementById('content');
 
 if(chapterParam){
   // Show single chapter detail
   const ch=book.chapters.find(c=>c.chapter==chapterParam);
   container.innerHTML=`
     <h2>${ch.title}</h2>
     <p><b>SS1 Quick:</b> ${ch.summary_simple}</p>
     <button class="blue-btn" onclick="document.getElementById('long').style.display=document.getElementById('long').style.display=='block'?'none':'block'">🔵 SS2 / SS3 Long Summary - Click to Read</button>
     <div id="long" class="long-content">${ch.summary_detailed.replace(/\n/g,'<br>')}</div>
     <div style="margin-top:20px"><b>Video:</b><br><video controls style="width:100%;border-radius:10px"><source src="${ch.cloudinary_url}" type="video/mp4"></video></div>
     <br><a href="book.html?book=${bookId}">← Back to all 34 chapters</a>
   `;
 } else {
   // Show all 34 chapters list
   let html=`<h1>${book.title} by ${book.author}</h1><p>${book.description}</p><hr>`;
   book.chapters.forEach(ch=>{
     html+=`<div class="chapter-card" onclick="location.href='book.html?book=${bookId}&chapter=${ch.chapter}'"><b>Chapter ${ch.chapter}</b> - ${ch.title}<br><small>${ch.summary_simple.substring(0,90)}...</small></div>`;
   });
   container.innerHTML=html;
 }
});
</script>
</body>
</html>
