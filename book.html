<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redemption Road - LitToon</title>
<style>
*{ box-sizing: border-box; }
body{ font-family: Inter, sans-serif; background:#fff; margin:0; color:#111; }
.container{ max-width:800px; margin:0 auto; padding:15px; }
.top-nav{ position:sticky; top:0; background:#fff; z-index:99; padding:10px 0; border-bottom:1px solid #eee; overflow-x:auto; white-space:nowrap; }
.top-nav button{ margin:4px; padding:8px 14px; border-radius:20px; border:1px solid #ddd; background:#f7f7f7; }
.chapter-block{ padding:30px 0; border-bottom:10px solid #f5f5f5; }
.chapter-title{ font-size:20px; font-weight:800; margin-bottom:8px; }
.video-box{ width:100%; aspect-ratio:16/9; background:#000; border-radius:12px; overflow:hidden; margin:12px 0; }
.video-box video{ width:100%; height:100%; }
.summary-simple{ background:#f0fdf4; border-left:4px solid #22c55e; padding:12px; border-radius:8px; margin:10px 0; white-space:pre-line; line-height:1.6; }
.btn-full{ width:100%; background:#2563eb; color:#fff; border:none; padding:14px; border-radius:10px; font-weight:700; cursor:pointer; margin:10px 0; }
.summary-detailed{ display:none; background:#eff6ff; padding:14px; border-radius:8px; line-height:1.8; white-space:pre-line; }
</style>
</head>
<body>
<div class="container">
  <h1>REDEMPTION ROAD - ELMA SHAW</h1>
  <div class="top-nav" id="topNav"></div>
  <div id="allChapters"></div>
</div>

<script>
const chaptersData = [
  {
    chapter: 1,
    title: "Chapter 1 - The Memorial",
    video: "https://res.cloudinary.com/hdnjnj1g/video/upload/v1793271463/lv_0_20261029105645_1.mp4",
    simple: `SS1 QUICK SUMMARY (For JSS/SS1):
Bendu Lewis attends memorial service for her grandmother Granny May who died during war. Bendu remembers pushing Granny May in wheelbarrow during escape from Charlue Town. Granny May died on the road. Bendu was captured by rebels Commander Cobra and Samson who broke her finger. She spent one year with them. She has a secret she is afraid to tell her family.`,
    detailed: `FULL STORY CHAPTER 1 (For SS2 & SS3 WASSCE):

The chapter begins at a memorial service for Catherine May Tyler Lewis (Granny May). She died almost ten years ago during Liberian civil war and her body was never found. Family holds service with empty casket containing her portrait, Bible, family pictures, picture of husband Samuel Lewis II, white rose and Liberian flag.

Main character is Bendu Lewis, Granny May's granddaughter. She is in pain because she was last person to see grandmother alive.

Bendu's parents Ben and Eva Lewis left Liberia early 1990s when Charles Taylor entered Liberia to fight President Samuel K. Doe. After nine years of war Taylor became President. They lost property and returned from America for memorial. They stay with daughter Siatta and husband Terrance Clarke.

During war, Bendu pushed sick Granny May in dirty rusty wheelbarrow escaping Charlue Town. People shouted leave old woman and run. She saw abandoned babies crying, children trampled, old sick people left behind. She refused to leave. Hands blistered, legs sore. Granny May whispered "Leave me baby. Go. Save yourself!" Bendu refused. Granny May's body went limp and died. Old man told Bendu "You did well to stay with your Ma. God will bless you."

Immediately after, about thirty rebel fighters appeared. Not official army. Some wore wigs, some very young boys. Leaders: Commander Cobra - tall muscular man with moustache - and Samson - man with dreadlocks.

Bendu tired of war, wanted to die to join late fiancé Jonah in heaven. Not afraid, even sucked teeth at them. Samson wanted to hit her, Commander Cobra stopped him.

They asked name, she said "Bendu Lewis". They called her "Congo girl" and "Americo-Liberian". Cobra surprised she speaks local dialect. She learned at University of Liberia.

Fighters laughed for carrying dead body and ordered follow them. Bendu held wheelbarrow and refused. Samson hit finger hard with gun until it broke with crack. Men dragged her away screaming. She fainted from pain, hunger, shock. Woke up dark, fighters setting up camp in woods.

Ends back at memorial service. Bendu surrounded by family and friends from peace education center like Agnes, Tenneh, Calvin Daniels. But feels alone. Has secret about one year spent with fighters, afraid family will not understand or forgive. She cannot forget war even though others say "forget it" and "let bygones be bygones".

Characters: Bendu Lewis, Granny May, Benjamin and Eva Lewis, Commander Cobra and Samson.
Theme: Love, loss, trauma, survival.`
  },
  {
    chapter: 2,
    title: "Chapter 2 - In The Cause Of The People",
    video: "", // paste your Chapter 2 Cloudinary link here when ready
    simple: `SS1 QUICK SUMMARY:
1986, Monrovia. Moses Varney rushes to Temple of Justice. Bodyguard Weah driving his Pajero. Dashboard has sticker "IN THE CAUSE OF THE PEOPLE, THE STRUGGLE CONTINUES" from 1980 coup. At Capitol Bypass, street boys Simeon and Alphonso shout "Brother V! Father!" Varney remembers age 11, overloaded minibus from Sanniquellie to Monrovia fell into ravine, parents died. He promises Simeon "I won't forget you". He believes no peace without justice.`,
    detailed: `FULL STORY CHAPTER 2 (For SS2 & SS3 WASSCE):

Scene 1-2: 1986 Monrovia. Moses Varney 45yo in navy suit, dark skin, glasses, in hurry. Lives at stake. Must get to Temple of Justice. Bodyguard Weah 35yo muscular bald driving. Dashboard sticker "IN THE CAUSE OF THE PEOPLE THE STRUGGLE CONTINUES" reminds of 1980 coup.

Scene 3: At Capitol Bypass near Temple of Justice, street boys Simeon & Alphonso 16yo slim, faded t-shirts, barefoot, shout Brother V! Father! His boys.

Scene 4: Looking at them Varney flashback - Age 11. Overloaded yellow minibus Sanniquellie to Monrovia with people, farm produce, chickens, goat, pig. Fell into ravine. Parents died.

Scene 5: He promises Simeon "I won't forget you". Knocks on big ornate door of Judiciary. Theme: Justice is foundation of peace.

WASSCE Question: Why does Varney care about street boys? Because he was orphaned young and knows pain of being abandoned.`
  }
];

for(let i=3; i<=34; i++){
  chaptersData.push({
    chapter: i,
    title: `Chapter ${i}`,
    video: "",
    simple: `Chapter ${i} short summary (SS1) - waiting for your novel text. When you send Chapter ${i} book, we will write short + long together.`,
    detailed: `Chapter ${i} full story (SS2 & SS3) - waiting.`
  });
}

const topNav = document.getElementById('topNav');
const allChapters = document.getElementById('allChapters');

chaptersData.forEach(ch => {
  const b = document.createElement('button');
  b.innerText = ch.chapter;
  b.onclick = ()=> document.getElementById('chapter-'+ch.chapter).scrollIntoView({behavior:'smooth'});
  topNav.appendChild(b);
  const div = document.createElement('div');
  div.className='chapter-block';
  div.id='chapter-'+ch.chapter;
  div.innerHTML=`
    <div class="chapter-title">${ch.title}</div>
    <div class="video-box">
      ${ch.video ? `<video controls playsinline src="${ch.video}"></video>` : `<div style="color:#999; text-align:center; padding:60px 10px;">Chapter ${ch.chapter} video coming soon</div>`}
    </div>
    <div class="summary-simple">${ch.simple}</div>
    <button class="btn-full" onclick="toggleFull('detail-${ch.chapter}', this)">📚 Click here to read FULL detailed story (SS2 & SS3) ▼</button>
    <div class="summary-detailed" id="detail-${ch.chapter}">${ch.detailed}</div>
  `;
  allChapters.appendChild(div);
});

function toggleFull(id, btn){
  const el = document.getElementById(id);
  if(el.style.display==='block'){ el.style.display='none'; btn.innerText='📚 Click here to read FULL detailed story (SS2 & SS3) ▼'; }
  else { el.style.display='block'; btn.innerText='📚 Hide full story ▲'; }
}
</script>
</body>
</html>
