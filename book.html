<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LitToon - Chapter</title>
<style>
body{font-family:Arial,sans-serif;background:#f0f2f5;margin:0;padding:0}
.header{background:#3b5bff;color:white;padding:15px}
.header a{color:white;text-decoration:none;font-weight:bold}
.content{background:white;margin:15px;padding:20px;border-radius:10px;line-height:1.8}
.ad-box{background:#fff3cd;border:1px dashed #ffc107;padding:15px;margin:15px 0;text-align:center}
.video-box{width:100%;max-width:700px;background:#000;margin:15px 0;border-radius:10px;overflow:hidden}
.video-box iframe{width:100%;height:340px;border:none}
.video-box video{width:100%;height:340px}
.meta{color:#666;font-size:14px;margin-bottom:8px}
.btn-full{background:#3b5bff;color:white;border:none;padding:12px 18px;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;width:100%;margin:10px 0}
.btn-full:active{transform:scale(0.98)}
.summary-detailed{display:none;white-space:pre-wrap;text-align:justify;font-size:16px;color:#222;background:#f9fbff;padding:15px;border-radius:8px;border:1px solid #dbe2ff;margin-top:10px}
.summary-simple{padding:12px;background:#f5f5f5;border-left:4px solid #3b5bff;margin:10px 0}
</style>
</head>
<body>
<div class="header"><a href="index.html">← Back</a></div>
<div class="content" id="content">Loading...</div>
<script>
function toggleFull(){
  const el=document.getElementById('fullBox');
  const btn=document.getElementById('toggleBtn');
  if(el.style.display==='block'){
    el.style.display='none';
    btn.innerHTML='📚 Click here to read FULL detailed story (For SS2 & SS3 WASSCE) ▼';
  }else{
    el.style.display='block';
    btn.innerHTML='📚 Hide full story ▲';
    el.scrollIntoView({behavior:'smooth'});
  }
}
function getParams(){
  const p=new URLSearchParams(window.location.search);
  return {book:p.get('book'),chapter:parseInt(p.get('chapter'))}
}
fetch('data/books.json')
.then(r=>r.json())
.then(allBooks=>{
  const {book,chapter}=getParams();
  const bookData=allBooks.find(b=>b.id==book);
  const chData=bookData.chapters.find(c=>c.chapter==chapter);
  const hasVideo=chData.video_id && chData.video_embed_url;
  const isMp4 = chData.video_type === 'mp4' || (chData.cloudinary_url && chData.cloudinary_url.endsWith('.mp4'));
  const videoUrl = chData.cloudinary_url || chData.video_embed_url;
  const videoEmbed = hasVideo ? (isMp4
  ? `<video controls playsinline><source src="${videoUrl}" type="video/mp4"></video>`
  : `<iframe src="${chData.video_embed_url}" allowfullscreen></iframe>`)
  : '';
document.getElementById('content').innerHTML=
`<div class="meta">${bookData.type} | ${bookData.author} | ${bookData.title}</div>
<h1>${bookData.title}</h1>
<h2>${chData.title}</h2>
<div class="meta">Characters: ${chData.characters ? chData.characters.join(', ') : ''}</div>
<div class="meta">Theme: ${chData.theme || ''}</div>
${chData.setting ? `<div class="meta">Setting: ${chData.setting}</div>` : ''}

<div class="summary-simple"><strong>Quick Summary (For SS1):</strong> ${chData.summary_simple}</div>

<button id="toggleBtn" class="btn-full" onclick="toggleFull()">📚 Click here to read FULL detailed story (For SS2 & SS3 WASSCE) ▼</button>
<div id="fullBox" class="summary-detailed">${chData.summary_detailed ? chData.summary_detailed : chData.summary_simple}</div>

<div class="ad-box">AD SPACE 2</div>
<h3>▶️ Video Lesson (For Everyone - SS1 to SS3)</h3>
${hasVideo ? `<div class="video-box">${videoEmbed}</div>` : '<p>No video yet</p>'}
<div class="ad-box">AD SPACE 3</div>
`;
});
</script>
</body>
</html>
